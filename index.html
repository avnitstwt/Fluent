<title>FluentPro – Workplace English Trainer</title>
<style>
/* ==========================================================================
   FluentPro – dark premium theme
   ========================================================================== */

:root {
  color-scheme: dark;
  --bg: #0a0c12;
  --bg-2: #0e1119;
  --surface: #131722;
  --surface-2: #181d2a;
  --surface-3: #1f2535;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text: #eceef5;
  --text-2: #c3c8d6;
  --muted: #98a1b6;
  --accent: #8b7cf6;
  --accent-strong: #a597ff;
  --accent-soft: rgba(139, 124, 246, 0.14);
  --cyan: #38bdf8;
  --success: #34d399;
  --success-soft: rgba(52, 211, 153, 0.12);
  --success-border: rgba(52, 211, 153, 0.55);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.12);
  --danger-border: rgba(248, 113, 113, 0.55);
  --warning: #fbbf24;
  --warning-soft: rgba(251, 191, 36, 0.12);
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -12px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 24px 64px -24px rgba(0, 0, 0, 0.8);
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari',
    'Helvetica Neue', Arial, sans-serif;
  --font-hi: 'Noto Sans Devanagari', 'Nirmala UI', 'Mangal', 'Kohinoor Devanagari', var(--font);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--text);
  background:
    radial-gradient(1100px 520px at 85% -10%, rgba(139, 124, 246, 0.11), transparent 60%),
    radial-gradient(900px 480px at -10% 10%, rgba(56, 189, 248, 0.06), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1,
h2,
h3 {
  line-height: 1.2;
  margin: 0;
  letter-spacing: -0.015em;
}

p {
  margin: 0;
}

button {
  font: inherit;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--surface-3);
  padding: 0.1em 0.4em;
  border-radius: 6px;
  word-break: break-all;
}

kbd {
  display: inline-grid;
  place-items: center;
  min-width: 1.7em;
  height: 1.7em;
  padding: 0 0.4em;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 6px;
}

svg {
  flex-shrink: 0;
}

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
  border-radius: 8px;
}

main:focus {
  outline: none;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 100;
  padding: 10px 14px;
  background: var(--accent);
  color: #0b0b14;
  font-weight: 600;
  border-radius: 10px;
  text-decoration: none;
  transition: top 0.15s;
}
.skip-link:focus {
  top: 12px;
}

.muted {
  color: var(--muted);
}

.text-gradient {
  background: linear-gradient(90deg, var(--accent-strong), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.container {
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding-left: clamp(14px, 4vw, 28px);
  padding-right: clamp(14px, 4vw, 28px);
}

/* ---------- Header ---------- */
.header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(10, 12, 18, 0.82);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border);
}
.header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 60px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
}
.brand__mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  color: #0b0b14;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-strong), var(--cyan));
}
.brand__name span {
  color: var(--accent-strong);
}
.nav {
  display: flex;
  gap: 4px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav__link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 0.93rem;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
}
.nav__link:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav__link.is-active {
  color: var(--text);
  background: var(--surface-3);
}

/* ---------- Layout helpers ---------- */
.page {
  flex: 1;
  padding-top: clamp(20px, 4vw, 40px);
  padding-bottom: 48px;
}
.page--center {
  display: grid;
  place-items: center;
}
.page-anim {
  flex: 1;
  display: flex;
  flex-direction: column;
  animation: fadeUp 0.28s var(--ease);
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.page-head__aside {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 14px 20px;
  min-width: 150px;
}
.page-title {
  font-size: clamp(1.6rem, 3.6vw, 2.2rem);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.page-lead {
  margin-top: 8px;
  max-width: 62ch;
}
.eyebrow {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-strong);
  margin-bottom: 8px;
}
.big-number {
  font-size: 2rem;
  font-weight: 700;
}
.big-number small {
  font-size: 1rem;
  color: var(--muted);
  font-weight: 500;
}
.panel {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: clamp(16px, 3vw, 24px);
}
.panel + .panel,
.stats-grid + .panel {
  margin-top: 20px;
}
.panel__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.panel__title {
  font-size: 1.1rem;
  font-weight: 650;
}
.empty-state {
  max-width: 520px;
  width: 100%;
  text-align: center;
  display: grid;
  gap: 14px;
  justify-items: center;
}
.empty-state__icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--surface-3);
  color: var(--muted);
  font-size: 1.4rem;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 6px;
}
.actions--center {
  justify-content: center;
}
.notice {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius);
  border: 1px solid rgba(251, 191, 36, 0.4);
  background: var(--warning-soft);
  color: #fde68a;
  margin-bottom: 18px;
}
.notice--success {
  border-color: var(--success-border);
  background: var(--success-soft);
  color: #a7f3d0;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.2;
  cursor: pointer;
  text-align: center;
  transition: transform 0.12s var(--ease), background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
.btn--primary {
  color: #0d0b1a;
  background: linear-gradient(180deg, #a597ff, #8b7cf6);
  box-shadow: 0 8px 24px -10px rgba(139, 124, 246, 0.7);
}
.btn--primary:hover {
  background: linear-gradient(180deg, #b3a8ff, #9a8cfa);
}
.btn--ghost {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.btn--ghost:hover {
  background: var(--surface-3);
}
.btn--danger {
  color: #fff;
  background: #b42318;
  border-color: rgba(255, 255, 255, 0.08);
}
.btn--danger:hover {
  background: #c8321f;
}
.btn--locked {
  color: var(--muted);
  background: var(--bg-2);
  border-color: var(--border);
  border-style: dashed;
  cursor: not-allowed;
  font-weight: 500;
  font-size: 0.85rem;
}
.btn--lg {
  min-height: 52px;
  padding: 14px 22px;
  font-size: 1rem;
}
.btn--block {
  width: 100%;
}
.btn--icon {
  min-height: 42px;
  padding: 8px 12px;
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.btn--icon:hover {
  background: var(--surface-3);
}
.btn--icon-danger:hover {
  border-color: var(--danger-border);
  color: var(--danger);
}

/* ---------- Chips, tags, badges ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  border: 1px solid var(--border-strong);
  color: var(--text-2);
}
.chip--accent {
  color: #d4ceff;
  background: var(--accent-soft);
  border-color: rgba(139, 124, 246, 0.35);
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.tag {
  font-size: 0.75rem;
  color: var(--text-2);
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid var(--border);
}
.badge--accent {
  color: #d4ceff;
  background: var(--accent-soft);
}
.badge--success {
  color: #a7f3d0;
  background: var(--success-soft);
  border-color: rgba(52, 211, 153, 0.35);
}
.badge--muted {
  color: var(--muted);
  background: var(--bg-2);
}

/* ---------- Progress bars ---------- */
.progress {
  width: 100%;
}
.progress__meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--text-2);
  margin-bottom: 6px;
}
.progress__value {
  font-variant-numeric: tabular-nums;
}
.progress__track {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.progress--sm .progress__track {
  height: 6px;
}
.progress__fill {
  height: 100%;
  border-radius: inherit;
  transition: width 0.4s var(--ease);
}
.progress__fill--accent {
  background: linear-gradient(90deg, var(--accent), var(--cyan));
}
.progress__fill--success {
  background: var(--success);
}
.progress__fill--warning {
  background: var(--warning);
}
.progress__fill--danger {
  background: var(--danger);
}
.progress__fill--muted {
  background: rgba(255, 255, 255, 0.18);
}

/* ---------- Stat cards ---------- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  min-width: 0;
}
.stat__top {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 0.82rem;
}
.stat__value {
  font-size: 1.55rem;
  font-weight: 700;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.stat__hint {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 2px;
}
.stat--success .stat__icon,
.stat--success .stat__value {
  color: var(--success);
}
.stat--danger .stat__icon,
.stat--danger .stat__value {
  color: var(--danger);
}
.stat--warning .stat__icon,
.stat--warning .stat__value {
  color: var(--warning);
}
.stat--accent .stat__value {
  color: var(--accent-strong);
}

/* ---------- Home ---------- */
.hero {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  gap: clamp(24px, 5vw, 56px);
  padding-top: clamp(12px, 3vw, 32px);
  padding-bottom: clamp(24px, 4vw, 48px);
}
.hero__title {
  font-size: clamp(2rem, 5.2vw, 3.4rem);
  font-weight: 750;
  letter-spacing: -0.03em;
}
.hero__lead {
  margin-top: 16px;
  font-size: clamp(1rem, 1.6vw, 1.12rem);
  color: var(--text-2);
  max-width: 56ch;
}
.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}
.hero__facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  list-style: none;
  padding: 0;
  margin: 28px 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}
.hero__facts strong {
  color: var(--text);
  font-size: 1.05rem;
  margin-right: 4px;
}
.preview-card {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border-strong);
  border-radius: 22px;
  padding: 22px;
  box-shadow: var(--shadow-lg);
  display: grid;
  gap: 12px;
}
.preview-card__top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.preview-card__q {
  color: var(--text-2);
  font-weight: 600;
}
.preview-card__hi {
  font-family: var(--font-hi);
  font-size: 1.2rem;
  line-height: 1.5;
}
.preview-card__hints {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.preview-card__hints span {
  font-size: 0.8rem;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-family: var(--font-hi);
}
.preview-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 0.93rem;
  color: var(--text-2);
}
.preview-opt.is-correct {
  border-color: var(--success-border);
  background: var(--success-soft);
  color: var(--text);
}
.preview-opt.is-correct svg {
  margin-left: auto;
  color: var(--success);
}
.preview-timer {
  position: relative;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.85rem;
}
.preview-timer svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}
.preview-timer__ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 163.4;
  stroke-dashoffset: 49;
}
.section {
  padding-top: clamp(20px, 4vw, 36px);
  padding-bottom: clamp(8px, 2vw, 16px);
}
.section__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.section__title {
  font-size: clamp(1.25rem, 2.6vw, 1.6rem);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section > .section__title {
  margin-bottom: 18px;
}
.steps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.step {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.step h3 {
  font-size: 1rem;
  margin: 12px 0 6px;
}
.step p {
  color: var(--muted);
  font-size: 0.92rem;
}
.step__icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 1.15rem;
}
.level-strip {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 10px;
  list-style: none;
  padding: 0;
  margin: 0;
}
.level-strip__item {
  display: grid;
  gap: 4px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
  min-width: 0;
}
.level-strip__item.is-passed {
  border-top-color: var(--success);
}
.level-strip__item.is-locked {
  border-top-color: var(--surface-3);
  opacity: 0.75;
}
.level-strip__num {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.level-strip__title {
  font-weight: 650;
  font-size: 0.95rem;
}
.level-strip__state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.78rem;
  color: var(--muted);
}
.keys-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.keys-panel .section__title {
  margin-bottom: 6px;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.keys li {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  font-size: 0.9rem;
  color: var(--text-2);
}

/* ---------- Levels page ---------- */
.level-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 16px;
}
.level-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: border-color 0.2s, transform 0.2s var(--ease);
  animation: fadeUp 0.3s var(--ease) both;
}
.level-card:hover:not(.is-locked) {
  border-color: rgba(139, 124, 246, 0.35);
}
.level-card.is-current {
  border-color: rgba(139, 124, 246, 0.5);
}
.level-card.is-passed {
  border-color: rgba(52, 211, 153, 0.3);
}
.level-card.is-locked {
  background: repeating-linear-gradient(135deg, var(--surface) 0 12px, var(--bg-2) 12px 24px);
}
.level-card.is-locked .level-card__title,
.level-card.is-locked .level-card__desc,
.level-card.is-locked .tags {
  opacity: 0.6;
}
.level-card__top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.level-card__num {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--accent-strong);
  font-variant-numeric: tabular-nums;
}
.level-card.is-locked .level-card__num {
  color: var(--muted);
}
.level-card__title {
  font-size: 1.15rem;
  font-weight: 650;
}
.level-card__desc {
  color: var(--muted);
  font-size: 0.92rem;
}
.level-card__stats {
  margin-top: auto;
  display: grid;
  gap: 10px;
  padding-top: 6px;
}
.level-card__dl {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 0;
}
.level-card__dl div {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
}
.level-card__dl dt {
  font-size: 0.72rem;
  color: var(--muted);
}
.level-card__dl dd {
  margin: 0;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

/* ---------- Quiz ---------- */
.quiz {
  padding-top: 16px;
  max-width: 980px;
}
.quiz-bar {
  position: sticky;
  top: 60px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: var(--radius);
  background: rgba(19, 23, 34, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
}
.quiz-bar__info {
  flex: 1;
  min-width: 0;
}
.quiz-bar__level {
  font-size: 0.8rem;
  color: var(--accent-strong);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.quiz-bar__level span {
  color: var(--muted);
  font-weight: 500;
}
.quiz-bar__count {
  font-size: 0.95rem;
  color: var(--text-2);
}
.quiz-bar__count strong {
  color: var(--text);
}
.quiz-bar__score {
  display: grid;
  justify-items: center;
  font-size: 0.75rem;
  line-height: 1.1;
}
.quiz-bar__score strong {
  font-size: 1.35rem;
  color: var(--success);
  font-variant-numeric: tabular-nums;
}
.quiz-bar__actions {
  display: flex;
  gap: 8px;
}

.timer {
  --timer-color: var(--accent);
  position: relative;
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.timer--warning {
  --timer-color: var(--warning);
}
.timer--danger,
.timer--expired {
  --timer-color: var(--danger);
}
.timer__svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}
.timer__track {
  fill: none;
  stroke: var(--surface-3);
  stroke-width: 5;
}
.timer__ring {
  fill: none;
  stroke: var(--timer-color);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.1s linear, stroke 0.25s;
}
.timer__value {
  font-size: 1.2rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  color: var(--timer-color);
}
.timer__value small {
  font-size: 0.65em;
  margin-left: 1px;
  opacity: 0.8;
}
.timer--danger:not(.timer--frozen) .timer__value {
  animation: tick 1s ease-in-out infinite;
}
.timer--frozen .timer__ring {
  transition: none;
}

.quiz-stage {
  position: relative;
  margin-top: 14px;
}
.quiz-stage__content {
  transition: filter 0.2s, opacity 0.2s;
}
.quiz-stage__content.is-blurred {
  filter: blur(14px);
  opacity: 0.35;
  pointer-events: none;
  user-select: none;
}

.qcard {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(16px, 3vw, 24px);
  box-shadow: var(--shadow);
  display: grid;
  gap: 12px;
  animation: fadeUp 0.22s var(--ease);
}
.qcard__question {
  font-size: clamp(1.05rem, 2.2vw, 1.25rem);
  font-weight: 650;
}
.qcard__hindi {
  font-family: var(--font-hi);
  font-size: clamp(1.2rem, 2.8vw, 1.5rem);
  line-height: 1.55;
  padding: 10px 14px;
  border-left: 3px solid var(--accent);
  background: var(--bg-2);
  border-radius: 0 12px 12px 0;
}
.qcard__context {
  font-size: clamp(1rem, 2.2vw, 1.12rem);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--bg-2);
  border: 1px dashed var(--border-strong);
}

.hints {
  border: 1px solid rgba(56, 189, 248, 0.22);
  background: rgba(56, 189, 248, 0.05);
  border-radius: 12px;
  padding: 10px 12px;
}
.hints__title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #7dd3fc;
  margin-bottom: 8px;
}
.hints__list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.hint {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 0.88rem;
  max-width: 100%;
}
.hint__hi {
  font-family: var(--font-hi);
  color: var(--text);
}
.hint__arrow {
  color: var(--muted);
}
.hint__en {
  color: #bae6fd;
  font-weight: 550;
}

.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 4px;
}
.option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 56px;
  padding: 12px 14px;
  text-align: left;
  color: var(--text);
  background: var(--bg-2);
  border: 1.5px solid var(--border-strong);
  border-radius: 14px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.12s var(--ease), opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.option:hover:not([aria-disabled='true']) {
  border-color: rgba(139, 124, 246, 0.6);
  background: var(--surface-2);
}
.option:active:not([aria-disabled='true']) {
  transform: scale(0.995);
}
.option[aria-disabled='true'] {
  cursor: default;
}
.option__key {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  flex-shrink: 0;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-2);
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.option__letter {
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
}
.option__text {
  flex: 1;
  min-width: 0;
  font-size: 0.98rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.option__status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
}
.option--correct,
.option--reveal {
  border-color: var(--success);
  background: var(--success-soft);
}
.option--correct .option__status,
.option--reveal .option__status {
  color: #052e1c;
  background: var(--success);
}
.option--correct .option__key,
.option--reveal .option__key {
  background: var(--success);
  color: #052e1c;
  border-color: transparent;
}
.option--correct {
  animation: pop 0.25s var(--ease);
}
.option--wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
  animation: shake 0.3s var(--ease);
}
.option--wrong .option__status {
  color: #3b0909;
  background: var(--danger);
}
.option--wrong .option__key {
  background: var(--danger);
  color: #3b0909;
  border-color: transparent;
}
.option--dimmed {
  opacity: 0.5;
}

.feedback-slot {
  margin-top: 12px;
  min-height: 52px;
}
.feedback-placeholder {
  text-align: center;
  color: var(--muted);
  font-size: 0.88rem;
  padding: 14px 0;
}
.feedback {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  padding: 14px 16px 18px;
  border: 1px solid var(--border);
  background: var(--surface);
  display: grid;
  gap: 8px;
  animation: fadeUp 0.2s var(--ease);
}
.feedback__head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
}
.feedback__next {
  margin-left: auto;
  color: var(--muted);
  font-size: 0.85rem;
}
.feedback--correct {
  border-color: var(--success-border);
  background: var(--success-soft);
}
.feedback--correct .feedback__head {
  color: var(--success);
}
.feedback--wrong {
  border-color: var(--danger-border);
  background: linear-gradient(180deg, var(--danger-soft), transparent 70%), var(--surface);
}
.feedback--wrong .feedback__head {
  color: var(--danger);
}
.feedback--timeout {
  border-color: rgba(251, 191, 36, 0.5);
  background: linear-gradient(180deg, var(--warning-soft), transparent 70%), var(--surface);
}
.feedback--timeout .feedback__head {
  color: var(--warning);
}
.feedback__line {
  font-size: 0.93rem;
  color: var(--text-2);
}
.feedback__label {
  color: var(--muted);
  font-weight: 600;
}
.feedback__explain {
  font-size: 0.97rem;
  color: var(--text);
}
.feedback__hinglish,
.feedback__pro {
  font-size: 0.9rem;
  color: var(--text-2);
}
.feedback__tag {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 7px;
  border-radius: 6px;
  margin-right: 4px;
  color: #bae6fd;
  background: rgba(56, 189, 248, 0.12);
}
.feedback__tag--pro {
  color: #d4ceff;
  background: var(--accent-soft);
}
.feedback__timer {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.05);
}
.feedback__timer-fill {
  display: block;
  height: 100%;
  width: 100%;
  background: currentColor;
  color: var(--muted);
  transform-origin: left;
  animation-name: drain;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

.pause-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: start center;
  padding-top: clamp(20px, 8vh, 80px);
  z-index: 5;
}
.pause-overlay__panel {
  width: min(440px, 100%);
  text-align: center;
  display: grid;
  gap: 10px;
  justify-items: center;
  padding: 26px 22px;
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg);
  animation: fadeUp 0.2s var(--ease);
}
.pause-overlay__panel h2 {
  font-size: 1.3rem;
}
.pause-overlay__icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 1.3rem;
}

.show-touch {
  display: none;
}
@media (hover: none) and (pointer: coarse) {
  .hide-touch {
    display: none;
  }
  .show-touch {
    display: inline;
  }
}

/* ---------- Modal ---------- */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(4, 6, 10, 0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fadeIn 0.15s ease;
}
.modal__panel {
  width: min(460px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  padding: 22px;
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg);
  animation: fadeUp 0.2s var(--ease);
}
.modal__title {
  font-size: 1.2rem;
  margin-bottom: 8px;
}
.modal__body {
  color: var(--text-2);
  font-size: 0.95rem;
}
.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* ---------- Results ---------- */
.results-hero {
  display: flex;
  align-items: center;
  gap: clamp(18px, 4vw, 36px);
  margin-bottom: 20px;
}
.results-hero.is-pass .page-title {
  color: var(--success);
}
.results-hero.is-fail .page-title {
  color: var(--warning);
}
.results-hero__copy {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.results-hero__ring {
  --pct: 0;
  flex-shrink: 0;
  width: 128px;
  height: 128px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct) * 1%), var(--surface-3) 0);
}
.results-hero.is-pass .results-hero__ring {
  --ring-color: var(--success);
}
.results-hero.is-fail .results-hero__ring {
  --ring-color: var(--warning);
}
.results-hero__ring span {
  display: grid;
  place-items: center;
  width: 102px;
  height: 102px;
  border-radius: 50%;
  background: var(--surface);
  font-size: 1.6rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}
.group-bars {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: grid;
  gap: 14px;
}
.group-bar__head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.92rem;
  margin-bottom: 6px;
}
.group-bar__value {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- Dashboard ---------- */
.dash-levels {
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 14px;
}
.dash-level__head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 0.92rem;
  margin-bottom: 6px;
}
.dash-level__state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 0.85rem;
}
.dash-level.is-locked {
  opacity: 0.6;
}
.danger-zone {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-color: rgba(248, 113, 113, 0.25);
}

/* ---------- Footer ---------- */
.footer {
  border-top: 1px solid var(--border);
  padding: 18px 0;
  font-size: 0.85rem;
}
.footer__inner {
  display: flex;
  justify-content: space-between;
  gap: 8px 20px;
  flex-wrap: wrap;
}

/* ---------- Animations ---------- */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes pop {
  50% {
    transform: scale(1.012);
  }
}
@keyframes shake {
  25% {
    transform: translateX(-3px);
  }
  75% {
    transform: translateX(3px);
  }
}
@keyframes tick {
  50% {
    opacity: 0.6;
  }
}
@keyframes drain {
  from {
    transform: scaleX(1);
  }
  to {
    transform: scaleX(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  /* Keep the feedback countdown line meaningful but static. */
  .feedback__timer {
    display: none;
  }
}

/* ---------- Responsive ---------- */
@media (min-width: 860px) {
  .options {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 1020px) {
  .level-strip {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .steps {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 860px) {
  .hero {
    grid-template-columns: 1fr;
  }
  .hero__preview {
    max-width: 520px;
  }
}

@media (max-width: 640px) {
  .nav__label {
    display: none;
  }
  .nav__link {
    padding: 10px;
    font-size: 1.1rem;
  }
  .nav__link .nav__label {
    display: none;
  }
  .level-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .steps {
    grid-template-columns: 1fr;
  }
  .btn__label {
    display: none;
  }
  .quiz-bar {
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
  }
  .quiz-bar__info {
    flex-basis: calc(100% - 150px);
  }
  .timer {
    width: 52px;
    height: 52px;
  }
  .results-hero {
    flex-direction: column;
    align-items: flex-start;
  }
  .hero__actions .btn {
    width: 100%;
  }
  .page-head > .btn {
    width: 100%;
  }
}

@media (max-width: 400px) {
  body {
    font-size: 15px;
  }
  .brand__name {
    font-size: 1rem;
  }
  .option {
    padding: 10px 12px;
    gap: 8px;
  }
  .option__letter {
    display: none;
  }
  .quiz-bar__info {
    flex-basis: 100%;
    order: -1;
  }
  .quiz-bar__score {
    margin-right: auto;
  }
  .level-card__dl {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .modal__actions .btn {
    flex: 1;
  }
}

</style>
</head>
